server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # never cache the runtime config or the HTML shell
  location = /config.json { add_header Cache-Control "no-store"; }
  location = /index.html  { add_header Cache-Control "no-store"; }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # --- optional fallback: proxy the sheet through the container ---
  # Enable this (and point config.json csvProjects at "/sheet/...") only if the
  # browser cannot reach docs.google.com directly (egress or CORS). Then only the
  # container needs internet access.
  # location /sheet/ {
  #   proxy_pass https://docs.google.com/;
  #   proxy_set_header Host docs.google.com;
  #   proxy_ssl_server_name on;
  # }
}
